# 三端共用的 Mihomo 主配置示例：Windows / macOS / Android。
# 本文件可公开，但必须通过客户端本地脚本替换两个订阅占位地址。
# 不要直接填真实凭据后上传。操作与限制见 README.md。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

# 不设置 external-controller / secret；由客户端管理。
# 不写死 TUN 设备名、网卡、系统代理或 Android VPN 参数。
# 在各客户端启用接管；如开启客户端 DNS 覆写，应检查是否覆盖以下 DNS。
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 初学示例使用可直连的 DNS，避免首次启动依赖尚未就绪的代理。
  # 不承诺防 DNS 泄漏；加密 DNS 提供方仍能看到解析请求。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# Full 的分流规则使用 MetaCubeX 的 GeoSite / GeoIP DAT 和下方 8 个规则集。
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24

proxy-providers:
  airport-a:
    type: http
    url: 'https://example.invalid/airport-a'
    path: ./providers/airport-a.yaml
    interval: 21600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
      lazy: true
    override:
      additional-prefix: '[A] '
      # 保留原标签和编号，避免 HK01 和 香港01 改成同名。两个机场共用此表。
      proxy-name: &region_labels
        - pattern: '(?i)(^|[^a-zA-Z])(HK|HKG|Hong[ -]?Kong)(?=[^a-zA-Z]|$)'
          target: '${1}香港·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(US|USA|United[ -]?States)(?=[^a-zA-Z]|$)'
          target: '${1}美国·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(JP|JPN|Japan)(?=[^a-zA-Z]|$)'
          target: '${1}日本·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(SG|Singapore)(?=[^a-zA-Z]|$)'
          target: '${1}新加坡·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(TW|TWN|Taiwan)(?=[^a-zA-Z]|$)'
          target: '${1}台湾·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(KR|KOR|South[ -]?Korea)(?=[^a-zA-Z]|$)'
          target: '${1}韩国·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(CA|Canada)(?=[^a-zA-Z]|$)'
          target: '${1}加拿大·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(UK|GB|GBR|United[ -]?Kingdom)(?=[^a-zA-Z]|$)'
          target: '${1}英国·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(FR|France)(?=[^a-zA-Z]|$)'
          target: '${1}法国·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(DE|DEU|Germany)(?=[^a-zA-Z]|$)'
          target: '${1}德国·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(NL|Netherlands)(?=[^a-zA-Z]|$)'
          target: '${1}荷兰·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(TR|Turkey|Türkiye)(?=[^a-zA-Z]|$)'
          target: '${1}土耳其·${2}'
        - pattern: '(?i)(^|[^a-zA-Z])(RU|Russia)(?=[^a-zA-Z]|$)'
          target: '${1}俄罗斯·${2}'
  airport-b:
    type: http
    url: 'https://example.invalid/airport-b'
    path: ./providers/airport-b.yaml
    interval: 21600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
      lazy: true
    override:
      additional-prefix: '[B] '
      proxy-name: *region_labels

